name: Deploy dnabarcode

# Deploys the dnabarcode API with the platform's reusable workflow, pinned to
# a platform release (by its commit, as for actions): it builds the image with the serving bundle named in
# infra/deploy/dnabarcode.env, runs the known-answer checks
# (tests/known-answers) against it, pushes it and deploys it to Cloud Run.
# Called by the Release workflow for each v* tag, or run by hand from main
# (Actions > Deploy dnabarcode > Run workflow). Google only trusts runs from
# main and v* release tags of this repository.
on:
  workflow_call:
    inputs:
      check_public:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      check_public:
        description: "Check the live service after deploying (leave off for the very first deploy, before the service is made public)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Cloud Run
    uses: leehart3000/prokoptonml/.github/workflows/deploy-cloud-run.yml@52a5a2df8d5ea19797f774e933f4ff330ba84f81 # v0.2.0
    with:
      settings: infra/deploy/dnabarcode.env
      checks: tests/known-answers
      check_public: ${{ inputs.check_public }}
    permissions:
      contents: read
      id-token: write # To sign in to Google with Workload Identity Federation
