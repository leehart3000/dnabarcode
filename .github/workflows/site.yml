name: Site

# DNAbarcode.org: unit tests of the gateway and page scripts on every change
# to sites/, and browser tests of the live site after each release (called by
# the Release workflow), on demand (gh workflow run site.yml) and weekly, to
# catch changes outside the repository (Cloudflare, Cloud Run, certificates).
on:
  pull_request:
    paths: ["sites/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["sites/**", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 6 * * 1" # Mondays
  workflow_dispatch:
  workflow_call: # From the Release workflow, after a deploy
    inputs:
      live:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && !inputs.live
    runs-on: ubuntu-24.04 # Pinned; move to a newer image on purpose
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run the unit tests
        working-directory: sites/dnabarcode
        run: node --test test/*.test.js

  live:
    name: Browser tests of the live site
    if: inputs.live || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04 # Pinned; move to a newer image on purpose
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sites/dnabarcode
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/dnabarcode/package-lock.json
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        run: npx playwright test
