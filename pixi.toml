# DNAbarcode.org: the product. The ProkoptonML platform comes from PyPI at
# an exact version (prokopton-ml); this repository holds the app's config,
# reviewed reference files, model cards, checks, website and deploy settings.

[workspace]
name = "dnabarcode"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64"]
requires-pixi = ">=0.84"

# The same scientific stack as the platform, from conda-forge
[dependencies]
python = "3.13.*"
pydantic = ">=2.11,<3"
numpy = ">=2"
pandas = ">=2.2"
pyarrow = ">=19"
mlflow = ">=3.1,<4"
scikit-learn = ">=1.6"
scipy = ">=1.13"
fastapi = ">=0.162.4,<0.163"
uvicorn = ">=0.54.0,<0.55"

# The platform, pinned exactly (keep in step with PROKOPTON_ML_VERSION in
# the Dockerfile; `pixi run check` compares them)
[pypi-dependencies]
prokopton-ml = { version = "==0.2.0", extras = ["serve", "bio"] }

[feature.dev.dependencies]
ruff = "*"

[feature.dev.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
check-config = "python scripts/check_config.py"
check = { depends-on = ["format-check", "lint", "check-config"] }
# Compare the local bundle's answers with the golden set (tests/golden)
golden-check = "python scripts/golden.py check"
# Run the known-answer checks (tests/known-answers) against the local bundle,
# as every deploy does against the new image
known-answers = "prokopton-ml check data/models/dnabarcode/bundle tests/known-answers"
# pixi run release vX.Y.Z: tag main, follow the Release workflow and check
# the live footer (see docs/releasing-dnabarcode.md)
release = "prokopton-ml release --name DNAbarcode.org --check-url https://dnabarcode.org/"

# The pipeline: each stage runs the platform's command-line tool on this
# app's config
[tasks]
# Pipeline stages (prokopton-ml stages lists them, with when each last ran)
dnabarcode-stages = "prokopton-ml stages"
dnabarcode-ingest = "prokopton-ml run ingest"
dnabarcode-validate = "prokopton-ml run validate"
dnabarcode-split = "prokopton-ml run split"
dnabarcode-leakage = "prokopton-ml run leakage"
dnabarcode-sample = "prokopton-ml run router-sample"
dnabarcode-train = "prokopton-ml run router-train"
dnabarcode-calibrate = "prokopton-ml run router-calibrate"
dnabarcode-evaluate = "prokopton-ml run router-evaluate"
dnabarcode-card = "prokopton-ml run router-card"
dnabarcode-marker-sample = "prokopton-ml run marker-sample"
dnabarcode-marker-train = "prokopton-ml run marker-train"
dnabarcode-marker-calibrate = "prokopton-ml run marker-calibrate"
dnabarcode-marker-evaluate = "prokopton-ml run marker-evaluate"
dnabarcode-marker-card = "prokopton-ml run marker-card"
dnabarcode-culicidae-anchors = "prokopton-ml run culicidae-anchors"
dnabarcode-culicidae-reference = "prokopton-ml run culicidae-reference"
dnabarcode-culicidae-evaluate = "prokopton-ml run culicidae-evaluate"
dnabarcode-culicidae-card = "prokopton-ml run culicidae-card"
dnabarcode-bundle = "prokopton-ml run bundle"
dnabarcode-serve = { cmd = "uvicorn --factory prokopton.ml.serving.app:create_app_from_env --port 8080", env = { PROKOPTON_BUNDLE = "data/models/dnabarcode/bundle", PROKOPTON_API_TITLE = "DNAbarcode.org API" } }

[environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }
